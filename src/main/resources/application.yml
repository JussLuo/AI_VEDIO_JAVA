server:
  port: ${SERVER_PORT:8080}
spring:
  config:
    import: optional:file:./config/ai-local.yml
  application:
    name: vedio-java
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/vedio_java}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  sql:
    init:
      mode: always
      schema-locations: classpath:sql/schema.sql
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
vedio:
  upload-dir: ${UPLOAD_DIR:./data/uploads}
